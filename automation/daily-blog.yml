name: Autonomous Daily AI Blog Publisher

on:
  schedule:
    # Runs every day at 00:00 UTC (Midnight) - 100% Free via GitHub Actions
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  publish-daily-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run NeuralPulse Autonomous Post Generator
        run: node scripts/generate_post.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push New Post
        run: |
          git config --global user.name "Team Taniv (NeuralPulse)"
          git config --global user.email "teamtaniv@gmail.com"
          git add src/data/posts.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [Automated] Published Daily AI Technical Breakdown [skip ci]" && git push)
